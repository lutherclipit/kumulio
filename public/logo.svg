<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- RabattArchiv: Manila-Ordner, aus dem Geldscheine ragen, mit %-Badge -->
  <defs>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c14e"/>
      <stop offset="1" stop-color="#e09b2d"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98d26"/>
      <stop offset="1" stop-color="#a8731c"/>
    </linearGradient>
  </defs>

  <!-- Ordner-Rückseite mit Tab -->
  <path d="M6 18 q0 -4 4 -4 h12 l4 5 h24 q4 0 4 4 v28 q0 4 -4 4 H10 q-4 0 -4 -4 Z" fill="url(#folderBack)"/>

  <!-- Geldscheine, die aus dem Ordner ragen -->
  <g>
    <rect x="12" y="8" width="18" height="12" rx="1.5" fill="#d3f2df" stroke="#2ea862" stroke-width="1.4" transform="rotate(-8 21 14)"/>
    <circle cx="21" cy="13" r="3" fill="none" stroke="#2ea862" stroke-width="1.2" transform="rotate(-8 21 14)"/>
    <rect x="30" y="9" width="18" height="12" rx="1.5" fill="#bfeacf" stroke="#238552" stroke-width="1.4" transform="rotate(6 39 15)"/>
    <circle cx="39" cy="14" r="3" fill="none" stroke="#238552" stroke-width="1.2" transform="rotate(6 39 15)"/>
  </g>

  <!-- Ordner-Vorderseite, leicht gekippt (offener Ordner) -->
  <path d="M4 26 q-0.5 -3 2.8 -3 h50.4 q3.3 0 2.8 3 l-3.6 25 q-0.4 3 -3.4 3 H11 q-3 0 -3.4 -3 Z" fill="url(#folderFront)"/>

  <!-- %-Badge unten rechts -->
  <g>
    <circle cx="49" cy="48" r="11" fill="#1d7a46" stroke="#d3f2df" stroke-width="2"/>
    <line x1="44.5" y1="52.5" x2="53.5" y2="43.5" stroke="#d3f2df" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="45.2" cy="44.4" r="2.1" fill="none" stroke="#d3f2df" stroke-width="1.8"/>
    <circle cx="52.8" cy="51.6" r="2.1" fill="none" stroke="#d3f2df" stroke-width="1.8"/>
  </g>
</svg>
